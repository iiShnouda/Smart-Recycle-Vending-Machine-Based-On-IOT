name: Build arm64 .deb + GitHub Release

# Triggers:
#   - push a tag like  v0.2.0          → builds the .deb AND creates the release
#   - "Run workflow" from the Actions tab → builds the .deb for manual download
#
# Output:
#   build/rewingo_<version>_arm64.deb attached to the Release matching the tag.
#   The kiosk's in-app update button (UpdateChecker) polls
#   /repos/<owner>/<repo>/releases/latest, sees the new tag, downloads the
#   .deb, hands it to /usr/local/bin/rewingo-update-helper for dpkg -i.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  # required so softprops/action-gh-release can create the GitHub Release
  contents: write

env:
  # Opt the JS-based actions (checkout, upload-artifact, gh-release) onto
  # Node 24 now instead of the deprecated Node 20. Purely silences the
  # "Node.js 20 actions are deprecated" warning — GitHub flips this on
  # automatically after 2026-06-16 anyway. No effect on the build itself.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    # NATIVE arm64 cloud runner (free for public repos). This is a real
    # arm64 machine — no QEMU emulation, no instruction translation — so
    # the build runs at full speed (~5-10x faster than the emulated path).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history; CMake/CPack reads it for the version

      # The whole build runs inside a Debian Trixie container so:
      #   - apt package names match the Pi exactly (qt6-quick3d-dev etc.)
      #   - the .deb's versioned deps (libqt6core6 …) match Pi OS Trixie
      # Because the RUNNER is already arm64, this container runs NATIVELY
      # (no --platform / QEMU needed) — exact Pi environment, full speed.
      - name: Build the .deb inside arm64 Debian Trixie
        run: |
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD":/src -w /src \
            debian:trixie-slim bash -eux -c '
              echo "container arch: $(uname -m)"
              echo "container os:   $(. /etc/os-release; echo $PRETTY_NAME)"

              apt-get update

              # setup_pi.sh installs build-essential, cmake, ninja, Qt 6,
              # OpenCV, libmosquitto-dev, qt6-quick3d-dev, l10n tools, etc.
              # It also tries usermod -aG dialout pi which silently skips
              # when there is no pi user (container is root).
              bash packaging/setup_pi.sh

              # JOBS=2 keeps peak RAM under the runner cap; the linker step
              # for Qt + OpenCV otherwise gets OOM-killed.
              JOBS=2 bash packaging/build_deb.sh

              ls -lh build/*.deb
            '

      - name: Show the built .deb
        run: ls -lh build/*.deb

      - name: Upload .deb as an Actions artifact (for manual download)
        uses: actions/upload-artifact@v4
        with:
          name: rewingo-deb-${{ github.ref_name }}
          path: build/*.deb
          if-no-files-found: error

      - name: Attach .deb to the GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
